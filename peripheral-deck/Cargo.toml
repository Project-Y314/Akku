[workspace]
members = [
    "crates/peripheral-deck-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/ybreakless/peripheral-deck"
authors = ["PeripheralDeck Contributors"]

[workspace.dependencies]
peripheral-deck-core = { path = "crates/peripheral-deck-core" }
bitflags = { version = "2.6", features = ["serde"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri = { version = "2.1", features = ["tray-icon", "image-rgba"] }
tauri-build = { version = "2.0", features = [] }
tauri-plugin-autostart = "2.0"
tauri-plugin-shell = "2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"

[profile.dev]
opt-level = 1
